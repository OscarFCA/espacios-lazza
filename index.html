<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F6F1">
<title>Legato Capital · Patrimonio que trasciende</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Propiedades, terrenos y oportunidades de inversión en los lugares que importan. Encuentra el potencial de tu patrimonio.">
<meta property="og:title" content="Legato Capital · Patrimonio que trasciende">
<meta property="og:description" content="Propiedades, terrenos y oportunidades de inversión en los lugares que importan.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>

<header class="header">
  <div class="container header__bar">
    <!-- Wordmark tipográfico provisional: pendiente el logotipo de la marca. -->
    <button class="header__brand" data-action="home" aria-label="Legato Capital — inicio">
      <b>Legato</b><span>Capital</span>
    </button>

    <nav class="header__nav" id="nav-desktop" aria-label="Principal"></nav>

    <div class="header__actions">
      <button class="icon-btn" data-action="favs" aria-label="Guardados">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="btn btn--link header__cta" data-action="cuenta">Cuenta</button>
      <button class="btn btn--secondary btn--sm header__cta" data-action="publicar">Publicar propiedad</button>
      <button class="icon-btn header__menu" data-action="menu-open" aria-label="Abrir menú" aria-expanded="false" aria-controls="drawer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="overlay" id="overlay" hidden></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Menú" hidden>
  <div class="drawer__head">
    <span class="header__brand" style="margin:0"><b>Legato</b><span>Capital</span></span>
    <button class="icon-btn" data-action="menu-close" aria-label="Cerrar menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="drawer__body" id="nav-mobile" aria-label="Principal (móvil)"></nav>
  <div class="drawer__foot">
    <button class="btn btn--olive btn--block" data-action="publicar">Publicar propiedad</button>
    <button class="btn btn--link btn--block" data-action="cuenta">Cuenta</button>
  </div>
</aside>

<main id="main" tabindex="-1"></main>

<footer class="footer">
  <div class="container footer__inner">
    <div>
      <p class="footer__brand">Legato Capital</p>
      <p class="footer__tag">Propiedades con valor hoy y potencial para mañana.</p>
    </div>
    <p class="footer__note">Prototipo · Ciudad de México</p>
  </div>
</footer>

<!-- Bottom nav móvil (§21) -->
<nav class="bottomnav" id="bottomnav" aria-label="Navegación principal (móvil)"></nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
